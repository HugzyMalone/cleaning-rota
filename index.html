<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flat Cleaning Rota</title>
<meta name="description" content="Who's cleaning what this week.">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rota">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Room illustrations. Two-tone: a soft filled body under confident strokes,
     both taking the room's accent colour from currentColor. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="room-kitchen" viewBox="0 0 24 24">
    <path d="M4.5 10.8h15v4.3a5 5 0 0 1-5 5H9.5a5 5 0 0 1-5-5z" fill="currentColor" fill-opacity=".18"/>
    <path d="M4.5 10.8h15v4.3a5 5 0 0 1-5 5H9.5a5 5 0 0 1-5-5z"/>
    <path d="M4.5 12.6H2.6M19.5 12.6h1.9"/>
    <path d="M2.8 9.3h18.4" stroke-width="2"/>
    <path d="M12 9.3V7.1"/>
  </symbol>
  <symbol id="room-bathroom" viewBox="0 0 24 24">
    <path d="M2.8 12.7h18.4v2.4a5 5 0 0 1-5 5H7.8a5 5 0 0 1-5-5z" fill="currentColor" fill-opacity=".18"/>
    <path d="M2.8 12.7h18.4v2.4a5 5 0 0 1-5 5H7.8a5 5 0 0 1-5-5z"/>
    <path d="M6.6 12.7V6.3a2.3 2.3 0 0 1 4.6 0"/>
    <path d="M6.3 20.1l-.9 1.6M17.7 20.1l.9 1.6"/>
    <circle cx="9.4" cy="16.4" r=".85" fill="currentColor" stroke="none"/>
    <circle cx="13" cy="17.2" r=".6" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="room-living" viewBox="0 0 24 24">
    <path d="M5.6 12.2V9.4a2.8 2.8 0 0 1 2.8-2.8h7.2a2.8 2.8 0 0 1 2.8 2.8v2.8" fill="currentColor" fill-opacity=".18"/>
    <path d="M5.6 12.2V9.4a2.8 2.8 0 0 1 2.8-2.8h7.2a2.8 2.8 0 0 1 2.8 2.8v2.8"/>
    <path d="M3 18v-5.1a1.9 1.9 0 0 1 3.8 0V15h10.4v-2.1a1.9 1.9 0 0 1 3.8 0V18z" fill="currentColor" fill-opacity=".18"/>
    <path d="M3 18v-5.1a1.9 1.9 0 0 1 3.8 0V15h10.4v-2.1a1.9 1.9 0 0 1 3.8 0V18z"/>
    <path d="M5.4 18v1.8M18.6 18v1.8"/>
  </symbol>
  <symbol id="tick" viewBox="0 0 24 24">
    <path d="M5 12.6l4.4 4.4L19 7.4"/>
  </symbol>
</svg>

<header class="topbar">
  <div class="weeknav">
    <button class="stepper" id="prev-week" type="button" aria-label="Previous week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </button>
    <div class="weeklabel">
      <h1 id="week-title">&nbsp;</h1>
      <p id="week-sub">&nbsp;</p>
    </div>
    <button class="stepper" id="next-week" type="button" aria-label="Next week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>
    </button>
  </div>
  <button class="today-btn" id="today-btn" type="button" hidden>Back to this week</button>
</header>

<main>
  <section class="whoami" aria-label="Who are you?">
    <span class="whoami-label">You are</span>
    <div class="people" id="people-picker"></div>
  </section>

  <section class="stats" id="stats" aria-label="Your standing"></section>

  <section id="rooms" class="rooms" aria-label="Rooms this week"></section>

  <div class="all-done" id="all-done" hidden>
    <span class="all-done-mark">✦</span>
    <strong>The whole flat is spotless.</strong>
    <span>Every room, every task. Nice one.</span>
  </div>

  <section class="history" aria-labelledby="history-title">
    <h2 id="history-title">Recent weeks</h2>
    <div id="history" class="history-rows"></div>
  </section>

  <footer class="foot">
    <span id="sync-status" class="sync">Connecting…</span>
    <span class="dot">·</span>
    <span>Rota started Mon 14 Sep 2026</span>
  </footer>
</main>

<div id="sheet-backdrop" class="backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grip"></div>
  <h2 id="sheet-title">Swap</h2>
  <div id="sheet-body"></div>
  <button class="sheet-close" id="sheet-close" type="button">Cancel</button>
</div>

<div id="confetti" class="confetti-layer" aria-hidden="true"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
